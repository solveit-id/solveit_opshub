name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: solveit_opshub_test
          MYSQL_USER: opshub_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: solveit_opshub_test
      DB_USERNAME: opshub_ci
      DB_PASSWORD: ci-only-password
      DB_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, sodium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
      - run: cp .env.example .env
      - run: php artisan key:generate
      # Inertia HTTP tests render @vite and require a real build manifest.
      - name: Build frontend assets
        run: npm run build
      - name: Run application tests (MySQL)
        run: php artisan test
      - name: Check PHP formatting
        run: vendor/bin/pint --test
